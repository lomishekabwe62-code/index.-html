<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Expense Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --paper:#FAF8F3;
    --paper-alt:#F1EDE3;
    --ink:#211E1A;
    --ink-soft:#5B564C;
    --line:#DCD5C4;
    --green:#2F6F4E;
    --green-soft:#E4EEE6;
    --gold:#B8912A;
    --red:#A5423A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:680px;margin:0 auto;padding:32px 20px 80px;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:16px;
    margin-bottom:28px;
  }
  header h1{
    font-family:'Lora',serif;
    font-weight:600;
    font-size:1.7rem;
    margin:0;
    letter-spacing:-0.01em;
  }
  header .sub{
    font-size:0.8rem;
    color:var(--ink-soft);
    margin-top:4px;
  }
  header .month-nav{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.85rem;
  }
  header .month-nav button{
    background:none;
    border:1px solid var(--line);
    border-radius:6px;
    width:28px;height:28px;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink);
  }
  header .month-nav button:hover{border-color:var(--ink);}
  header .month-label{min-width:108px;text-align:center;}

  .totals{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    margin-bottom:28px;
  }
  .totals div{background:var(--paper);padding:16px 18px;}
  .totals .label{
    font-size:0.72rem;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-bottom:6px;
  }
  .totals .value{
    font-family:'IBM Plex Mono',monospace;
    font-size:1.5rem;
    font-weight:600;
  }
  .totals .value.spend{color:var(--red);}

  .panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px;
    margin-bottom:24px;
  }
  .panel h2{
    font-family:'Lora',serif;
    font-size:1.05rem;
    font-weight:600;
    margin:0 0 16px;
  }

  .form-row{display:flex;gap:10px;margin-bottom:10px;}
  .form-row > div{flex:1;}
  label{
    display:block;
    font-size:0.7rem;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-bottom:5px;
  }
  input,select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
    font-family:'Inter',sans-serif;
    font-size:0.9rem;
    color:var(--ink);
  }
  input:focus,select:focus{outline:none;border-color:var(--green);}

  .add-btn{
    width:100%;
    padding:11px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:6px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:0.9rem;
    cursor:pointer;
    margin-top:4px;
  }
  .add-btn:hover{background:var(--green);}

  .type-toggle{display:flex;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:10px;}
  .type-toggle button{
    flex:1;padding:8px;border:none;background:#fff;font-family:'Inter',sans-serif;
    font-size:0.85rem;font-weight:500;color:var(--ink-soft);cursor:pointer;
  }
  .type-toggle button.active{background:var(--ink);color:var(--paper);}

  table{width:100%;border-collapse:collapse;}
  th{
    text-align:left;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-soft);
    font-weight:500;
    padding:0 8px 8px;
    border-bottom:1px solid var(--line);
  }
  td{
    padding:10px 8px;
    border-bottom:1px solid var(--line);
    font-size:0.88rem;
    vertical-align:middle;
  }
  td.amount{
    font-family:'IBM Plex Mono',monospace;
    text-align:right;
    white-space:nowrap;
  }
  td.amount.income{color:var(--green);}
  td.amount.expense{color:var(--red);}
  .cat-tag{
    font-size:0.72rem;
    background:var(--paper-alt);
    color:var(--ink-soft);
    padding:2px 8px;
    border-radius:20px;
    display:inline-block;
  }
  .del{
    background:none;border:none;cursor:pointer;color:var(--ink-soft);
    font-size:0.75rem;padding:4px;
  }
  .del:hover{color:var(--red);}
  .empty{
    text-align:center;
    padding:30px 10px;
    color:var(--ink-soft);
    font-size:0.88rem;
  }

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:0.85rem;}
  .bar-row .name{width:100px;flex-shrink:0;color:var(--ink-soft);}
  .bar-row .track{flex:1;height:8px;background:var(--paper-alt);border-radius:4px;overflow:hidden;}
  .bar-row .fill{height:100%;background:var(--green);border-radius:4px;}
  .bar-row .amt{
    font-family:'IBM Plex Mono',monospace;
    width:76px;text-align:right;flex-shrink:0;
  }

  .toolbar{display:flex;justify-content:flex-end;margin-bottom:10px;}
  .toolbar button{
    background:none;border:1px solid var(--line);border-radius:6px;
    padding:6px 12px;font-size:0.78rem;font-family:'Inter',sans-serif;
    cursor:pointer;color:var(--ink-soft);
  }
  .toolbar button:hover{border-color:var(--ink);color:var(--ink);}

  .status{font-size:0.75rem;color:var(--ink-soft);text-align:center;margin-top:20px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Ledger</h1>
      <div class="sub">your money, plainly kept</div>
    </div>
    <div class="month-nav">
      <button onclick="shiftMonth(-1)">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button onclick="shiftMonth(1)">›</button>
    </div>
  </header>

  <div class="totals">
    <div>
      <div class="label">Income this month</div>
      <div class="value" id="totalIncome">K 0.00</div>
    </div>
    <div>
      <div class="label">Spent this month</div>
      <div class="value spend" id="totalExpense">K 0.00</div>
    </div>
  </div>

  <div class="panel">
    <h2>Add a transaction</h2>
    <div class="type-toggle">
      <button id="btnExpense" class="active" onclick="setType('expense')">Expense</button>
      <button id="btnIncome" onclick="setType('income')">Income</button>
    </div>
    <div class="form-row">
      <div>
        <label>Description</label>
        <input type="text" id="desc" placeholder="e.g. Transport, Data bundle, Sales">
      </div>
    </div>
    <div class="form-row">
      <div>
        <label>Amount (ZMW)</label>
        <input type="number" id="amount" placeholder="0.00" step="0.01">
      </div>
      <div>
        <label>Date</label>
        <input type="date" id="date">
      </div>
    </div>
    <div class="form-row" id="categoryRow">
      <div>
        <label>Category</label>
        <select id="category">
          <option>Transport</option>
          <option>Food</option>
          <option>Data & Airtime</option>
          <option>Rent</option>
          <option>Utilities</option>
          <option>Business</option>
          <option>Other</option>
        </select>
      </div>
    </div>
    <button class="add-btn" id="submitBtn" onclick="addEntry()">Add transaction</button>
    <button class="add-btn" id="cancelBtn" style="display:none;background:var(--paper-alt);color:var(--ink);margin-top:8px;" onclick="cancelEdit()">Cancel edit</button>
  </div>

  <div class="panel" id="breakdownPanel" style="display:none;">
    <h2>Where it went</h2>
    <div id="breakdown"></div>
  </div>

  <div class="panel">
    <div class="toolbar">
      <button onclick="exportCSV()">Export CSV</button>
    </div>
    <table>
      <thead>
        <tr><th>Date</th><th>Description</th><th>Category</th><th style="text-align:right;">Amount</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="emptyMsg" style="display:none;">No transactions this month yet. Add your first one above.</div>
  </div>

  <div class="status" id="status">loading…</div>

</div>

<script>
let entries = [];
let currentType = 'expense';
let viewDate = new Date();
let editingId = null;
const STORAGE_KEY = 'ledger:entries';

function setType(t){
  currentType = t;
  document.getElementById('btnExpense').classList.toggle('active', t==='expense');
  document.getElementById('btnIncome').classList.toggle('active', t==='income');
  document.getElementById('categoryRow').style.display = t==='expense' ? 'flex' : 'none';
}

function shiftMonth(delta){
  viewDate.setMonth(viewDate.getMonth()+delta);
  viewDate = new Date(viewDate);
  render();
}

function monthKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

function loadEntries(){
  const statusEl = document.getElementById('status');
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    entries = raw ? JSON.parse(raw) : [];
    statusEl.textContent = 'saved on this device';
  }catch(e){
    entries = [];
    statusEl.textContent = 'starting fresh';
  }
  if(!document.getElementById('date').value){
    document.getElementById('date').value = new Date().toISOString().slice(0,10);
  }
  render();
}

function saveEntries(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    document.getElementById('status').textContent = 'saved on this device';
  }catch(e){
    document.getElementById('status').textContent = 'could not save on this device';
  }
}

function addEntry(){
  const desc = document.getElementById('desc').value.trim();
  const amount = parseFloat(document.getElementById('amount').value);
  const date = document.getElementById('date').value;
  const category = currentType === 'expense' ? document.getElementById('category').value : 'Income';

  if(!desc || isNaN(amount) || amount <= 0 || !date){
    alert('Please fill in a description, a valid amount, and a date.');
    return;
  }

  if(editingId !== null){
    const idx = entries.findIndex(e => e.id === editingId);
    if(idx !== -1){
      entries[idx] = { ...entries[idx], desc, amount, category, date, type: currentType };
    }
    cancelEdit();
  } else {
    entries.push({
      id: Date.now(),
      desc, amount, category, date,
      type: currentType
    });
    document.getElementById('desc').value = '';
    document.getElementById('amount').value = '';
  }

  saveEntries();
  render();
}

function editEntry(id){
  const entry = entries.find(e => e.id === id);
  if(!entry) return;

  editingId = id;
  setType(entry.type);
  document.getElementById('desc').value = entry.desc;
  document.getElementById('amount').value = entry.amount;
  document.getElementById('date').value = entry.date;
  if(entry.type === 'expense'){
    document.getElementById('category').value = entry.category;
  }
  document.getElementById('submitBtn').textContent = 'Save changes';
  document.getElementById('cancelBtn').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit(){
  editingId = null;
  document.getElementById('desc').value = '';
  document.getElementById('amount').value = '';
  document.getElementById('date').value = new Date().toISOString().slice(0,10);
  document.getElementById('submitBtn').textContent = 'Add transaction';
  document.getElementById('cancelBtn').style.display = 'none';
}

function deleteEntry(id){
  if(editingId === id) cancelEdit();
  entries = entries.filter(e => e.id !== id);
  saveEntries();
  render();
}

function entriesForMonth(){
  const key = monthKey(viewDate);
  return entries.filter(e => e.date && e.date.slice(0,7) === key);
}

function render(){
  document.getElementById('monthLabel').textContent =
    viewDate.toLocaleDateString('en-GB', { month:'long', year:'numeric' });

  const monthEntries = entriesForMonth().sort((a,b)=> b.date.localeCompare(a.date));
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';

  let income = 0, expense = 0;
  const byCategory = {};

  monthEntries.forEach(e => {
    if(e.type === 'income') income += e.amount;
    else{
      expense += e.amount;
      byCategory[e.category] = (byCategory[e.category]||0) + e.amount;
    }

    const tr = document.createElement('tr');
    const sign = e.type === 'income' ? '+' : '−';
    tr.innerHTML = `
      <td>${new Date(e.date).toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</td>
      <td>${escapeHtml(e.desc)}</td>
      <td><span class="cat-tag">${escapeHtml(e.category)}</span></td>
      <td class="amount ${e.type}">${sign} K ${e.amount.toFixed(2)}</td>
      <td>
        <button class="del" onclick="editEntry(${e.id})">edit</button>
        <button class="del" onclick="deleteEntry(${e.id})">remove</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('emptyMsg').style.display = monthEntries.length ? 'none' : 'block';
  document.getElementById('totalIncome').textContent = 'K ' + income.toFixed(2);
  document.getElementById('totalExpense').textContent = 'K ' + expense.toFixed(2);

  const breakdownPanel = document.getElementById('breakdownPanel');
  const breakdown = document.getElementById('breakdown');
  const cats = Object.entries(byCategory).sort((a,b)=>b[1]-a[1]);
  if(cats.length){
    breakdownPanel.style.display = 'block';
    const max = cats[0][1];
    breakdown.innerHTML = cats.map(([name, amt]) => `
      <div class="bar-row">
        <div class="name">${escapeHtml(name)}</div>
        <div class="track"><div class="fill" style="width:${(amt/max*100).toFixed(0)}%"></div></div>
        <div class="amt">K ${amt.toFixed(2)}</div>
      </div>
    `).join('');
  } else {
    breakdownPanel.style.display = 'none';
  }
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function exportCSV(){
  const monthEntries = entriesForMonth();
  if(!monthEntries.length){ alert('No transactions to export for this month.'); return; }
  let csv = 'Date,Description,Category,Type,Amount (ZMW)\n';
  monthEntries.forEach(e=>{
    csv += `${e.date},"${e.desc.replace(/"/g,'""')}",${e.category},${e.type},${e.amount.toFixed(2)}\n`;
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ledger-${monthKey(viewDate)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

loadEntries();
</script>
</body>
</html>
